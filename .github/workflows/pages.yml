name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and patch checks
        run: |
          unzip -o enduring-pages.zip
          python3 patch-checks.py
          mkdir -p enduring-pages/assets
          if [ -f door-open.mp4 ]; then cp -f door-open.mp4 enduring-pages/assets/door-open.mp4; fi
          if [ -f door-open-poster.jpg ]; then cp -f door-open-poster.jpg enduring-pages/assets/door-open-poster.jpg; fi
          if [ -f book-open.mp4 ]; then cp -f book-open.mp4 enduring-pages/assets/book-open.mp4; fi
          if [ -f book-open-freeze.jpg ]; then cp -f book-open-freeze.jpg enduring-pages/assets/book-open-freeze.jpg; fi
          ls -la enduring-pages/assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: enduring-pages
      - id: deployment
        uses: actions/deploy-pages@v4
